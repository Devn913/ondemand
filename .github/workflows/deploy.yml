name: CI/CD Pipeline

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase Image Name
        run: |
          echo "IMAGE_NAME_LC=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Set up Kubernetes CLI
        uses: azure/setup-kubectl@v3

      - name: Deploy to Kubernetes
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBE_CONFIG }}
          OOD_DB_PASSWORD: ${{ secrets.OOD_DB_PASSWORD }}
          OOD_TEST_USER: ${{ secrets.OOD_TEST_USER }}
          OOD_TEST_PASS: ${{ secrets.OOD_TEST_PASS }}
        run: |
          if [ -z "$KUBECONFIG_DATA" ]; then
            echo "KUBE_CONFIG secret is not set! Skipping deployment."
            exit 1
          fi
          mkdir -p $HOME/.kube
          echo "$KUBECONFIG_DATA" | base64 -d > $HOME/.kube/config
          kubectl apply -f hooks/k8s-bootstrap/ondemand.yaml
          
          # Inject secrets from GitHub Secrets securely
          kubectl create secret generic ondemand-secrets \
            --namespace ondemand \
            --from-literal=db-password="$OOD_DB_PASSWORD" \
            --from-literal=test-user="$OOD_TEST_USER" \
            --from-literal=test-pass="$OOD_TEST_PASS" \
            --dry-run=client -o yaml | kubectl apply -f -
            
          kubectl apply -f k8s/database.yaml
          kubectl apply -f k8s/ondemand.yaml
          kubectl apply -f k8s/ingress.yaml
          kubectl rollout restart deployment ondemand -n ondemand
