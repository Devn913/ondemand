apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: ondemand
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ondemand-db
  namespace: ondemand
spec:
  selector:
    matchLabels:
      app: ondemand-db
  template:
    metadata:
      labels:
        app: ondemand-db
    spec:
      containers:
      - name: postgres
        image: postgres:15
        env:
        - name: POSTGRES_DB
          value: ondemand
        - name: POSTGRES_USER
          value: ood
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ondemand-secrets
              key: db-password
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: ondemand-db
  namespace: ondemand
spec:
  selector:
    app: ondemand-db
  ports:
  - port: 5432
    targetPort: 5432
